name: Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real-video test tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Install real-video test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool
      - name: Install package
        run: python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
        shell: bash
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: unittest.log
          if-no-files-found: warn
